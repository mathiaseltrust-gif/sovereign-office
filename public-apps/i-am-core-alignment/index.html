<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#101716">
<title>I AM — Core Alignment</title>
<style>
:root{
  --bg:#0c1213;
  --bg2:#111b19;
  --cream:#eee7dc;
  --muted:#9aa2a4;
  --muted2:#737d7e;
  --gold:#b08a69;
  --gold2:#8e7059;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#080d0e;color:var(--cream);overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit}
.app{
  min-height:100dvh;height:100dvh;width:100%;
  position:relative;overflow:hidden;
  background:
    radial-gradient(circle at 50% 43%,rgba(172,142,108,.11) 0%,rgba(89,102,85,.08) 24%,rgba(20,34,31,.08) 48%,transparent 70%),
    linear-gradient(180deg,#101819 0%,#0b1112 100%);
}
.ambient-wash{
  position:absolute;inset:-10%;pointer-events:none;z-index:0;opacity:.28;
  background:
    radial-gradient(circle at 50% 42%,rgba(182,146,111,.13) 0%,rgba(108,115,93,.055) 30%,transparent 67%);
  filter:blur(18px);
}
.ambient-wash.cue{animation:ambientCue 1.8s ease-in-out both}
@keyframes ambientCue{
  0%{opacity:.26;transform:scale(.985)}
  42%{opacity:.48;transform:scale(1.018)}
  100%{opacity:.28;transform:scale(1)}
}
.app:before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.23;
  background:
    radial-gradient(ellipse at center,transparent 0 43%,rgba(0,0,0,.34) 78%,rgba(0,0,0,.7) 100%),
    repeating-linear-gradient(0deg,rgba(255,255,255,.011) 0 1px,transparent 1px 3px);
}
.screen{
  position:absolute;inset:0;z-index:1;
  padding:calc(env(safe-area-inset-top) + 20px) 26px calc(env(safe-area-inset-bottom) + 22px);
  display:flex;flex-direction:column;
  transition:opacity .55s ease,transform .55s ease;
}
.screen.hidden{opacity:0;pointer-events:none;transform:scale(.985)}
.landing{align-items:center;text-align:center}
.hero{
  flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding-top:clamp(10px,5vh,44px)
}
.title{
  font-family:Didot,"Bodoni 72","Bodoni MT",Baskerville,"Times New Roman",serif;
  font-size:clamp(80px,20vw,148px);font-weight:400;line-height:.85;letter-spacing:.025em;
  color:#f0e8dd;text-shadow:0 0 45px rgba(222,195,158,.06);
}
.subtitle{
  margin-top:27px;font-size:clamp(14px,3.8vw,20px);letter-spacing:.38em;
  text-transform:uppercase;color:#a5aaab;font-weight:500;
}
.tagline{
  margin-top:72px;max-width:680px;
  font-family:Didot,"Bodoni 72",Baskerville,"Times New Roman",serif;
  font-size:clamp(25px,5.2vw,40px);line-height:1.5;font-style:italic;font-weight:400;
  color:#969693;text-wrap:balance;
}
.begin{
  margin-top:84px;width:min(76vw,450px);height:clamp(112px,14vh,156px);
  border-radius:999px;border:1.4px solid var(--gold2);
  background:rgba(255,255,255,.006);color:#b99477;
  font-family:Didot,"Bodoni 72",Baskerville,serif;
  font-size:clamp(35px,7vw,54px);letter-spacing:.28em;text-indent:.28em;
  cursor:pointer;
  box-shadow:inset 0 0 28px rgba(178,137,102,.025);
}
.begin:active{transform:scale(.985);background:rgba(176,138,105,.035)}
.share{
  border:0;background:transparent;color:#98a1a3;display:flex;align-items:center;gap:14px;
  font-size:16px;letter-spacing:.28em;text-transform:uppercase;cursor:pointer;padding:12px 18px;
  margin-bottom:clamp(46px,8vh,80px)
}
.share svg{width:27px;height:27px;stroke:currentColor;fill:none;stroke-width:1.8}
.disclaimer{
  color:#9a9fa0;font-size:clamp(13px,3.5vw,18px);line-height:1.55;text-align:center;
  max-width:690px;letter-spacing:.02em
}
.session{touch-action:pan-y;user-select:none;-webkit-user-select:none}
.center{
  flex:1;display:flex;align-items:center;justify-content:center;text-align:center;
  position:relative;padding:30px 0 68px
}
.glow{
  position:absolute;width:min(92vw,720px);height:min(92vw,720px);border-radius:50%;
  background:radial-gradient(circle,rgba(173,145,113,.085) 0%,rgba(101,111,90,.05) 34%,rgba(17,30,28,0) 72%);
  filter:blur(2px);pointer-events:none;
}
.card{
  z-index:1;width:100%;max-width:760px;min-height:44vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;padding:24px 8px;
}
.prompt{
  font-family:Didot,"Bodoni 72","Bodoni MT",Baskerville,"Times New Roman",serif;
  font-size:clamp(48px,10.5vw,92px);font-weight:400;letter-spacing:.025em;
  line-height:1.14;color:#eee7dd;text-wrap:balance;
  opacity:1;
  transform:translateY(0) scale(1);
  transition:
    opacity 1.18s cubic-bezier(.22,.61,.36,1),
    transform 1.18s cubic-bezier(.22,.61,.36,1);
  will-change:opacity,transform;
}
.answer{
  margin-top:70px;max-width:720px;
  font-family:Didot,"Bodoni 72",Baskerville,"Times New Roman",serif;
  font-size:clamp(24px,5.4vw,42px);line-height:1.5;font-style:italic;
  color:#c39b7c;text-wrap:balance;
  opacity:0;
  transform:translateY(6px) scale(.992);
  transition:
    opacity 1.28s cubic-bezier(.22,.61,.36,1),
    transform 1.28s cubic-bezier(.22,.61,.36,1);
  will-change:opacity,transform;
}
.answer.show{
  opacity:1;
  transform:translateY(0) scale(1);
}
.card.answer-closing .answer{
  opacity:0 !important;
  transform:translateY(-4px) scale(.995);
}
.card.prompt-closing .prompt{
  opacity:0 !important;
  transform:translateY(-4px) scale(.996);
}
.card.prompt-preenter .prompt{
  opacity:0 !important;
  transform:translateY(5px) scale(.994);
}
.hint{
  position:absolute;bottom:clamp(92px,15vh,138px);left:0;right:0;text-align:center;
  color:#899295;font-size:14px;letter-spacing:.34em;text-transform:uppercase;
}
.controls{
  width:100%;display:grid;grid-template-columns:1fr 1.25fr 1.1fr;align-items:center;
  gap:8px;color:#9ca5a7;padding-bottom:4px
}
.control{
  border:0;background:transparent;color:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px;
  text-transform:uppercase;letter-spacing:.24em;font-size:clamp(11px,3.3vw,15px);white-space:nowrap;padding:14px 2px
}
.control:first-child{justify-content:flex-start}
.control:last-child{justify-content:flex-end}
.control svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;flex:0 0 auto}
.fade{animation:fade .48s ease}
@keyframes fade{0%{opacity:.12;transform:translateY(7px)}100%{opacity:1;transform:translateY(0)}}
@media (max-height:700px){
  .tagline{margin-top:44px}.begin{margin-top:50px;height:104px}.share{margin-bottom:28px}
  .hero{padding-top:0}.hint{bottom:75px}.center{padding-bottom:44px}
}
@media (prefers-reduced-motion:reduce){.screen,.prompt,.answer{transition:none}.fade,.ambient-wash.cue{animation:none}.answer.show{opacity:1;transform:none}}
</style>
</head>
<body>
<main class="app" id="app">
  <div class="ambient-wash" id="ambientWash" aria-hidden="true"></div>
  <section class="screen landing" id="landing">
    <div class="hero">
      <div class="title">I AM</div>
      <div class="subtitle">CORE ALIGNMENT</div>
      <div class="tagline">Not from panic. Not as an escape. A return to the core self, in reality.</div>
      <button class="begin" id="begin">BEGIN</button>
    </div>
    <button class="share" id="shareLanding" aria-label="Share I AM Core Alignment">
      <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.8"/><circle cx="6" cy="12" r="2.8"/><circle cx="18" cy="19" r="2.8"/><path d="M8.5 10.8l6.8-4.2M8.5 13.2l6.8 4.2"/></svg>
      <span>SHARE</span>
    </button>
    <div class="disclaimer">A grounding and reflection experience. It is not hypnosis, therapy, or medical care.</div>
  </section>

  <section class="screen session hidden" id="session">
    <div class="center" id="touchArea">
      <div class="glow"></div>
      <div class="card" id="card" role="button" tabindex="0" aria-label="Reveal or advance">
        <div class="prompt" id="prompt">I AM.</div>
        <div class="answer" id="answer">I exist. I am here. Return to the present.</div>
      </div>
      <div class="hint">TAP OR SWIPE</div>
    </div>
    <div class="controls">
      <button class="control" id="backBtn">
        <svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg><span>BACK</span>
      </button>
      <button class="control" id="autoBtn"><span>AUTOPLAY OFF</span></button>
      <button class="control" id="soundBtn">
        <svg viewBox="0 0 24 24" id="soundIcon"><path d="M5 10v4h4l5 4V6l-5 4H5"/><path d="M18 9l4 6M22 9l-4 6"/></svg><span>SOUND OFF</span>
      </button>
    </div>
  </section>
</main>

<script>
const cards=[
["I AM.","I exist. I am here. Return to the present."],
["Who is observing this moment?","I am. I can observe without becoming every thought."],
["What comes before reaction?","Awareness. Then choice."],
["This body is my present vessel.","Protect it. Feed it. Move it. Rest it. Breathe."],
["Noise is not command.","I can notice an input without obeying it."],
["What deserves my energy?","Truth, healing, purpose, loved ones, and deliberate action."],
["I do not need to fight every signal.","Discern. Verify. Choose what actually requires action."],
["When the mind becomes overloaded—","Return to breath, body, surroundings, and the next real step."],
["Desire does not control choice.","Pause. Observe the urge. Choose from the larger self."],
["What is the core sequence?","I AM → I observe → I choose → I care → I act → I live."]
];

let i=0,revealed=false,autoplay=false,sound=false,timer=null,startX=0,startY=0,transitioning=false,audioCtx=null,ambientMaster=null,ambientOsc432=null,ambientOsc216=null;
const landing=document.getElementById("landing"),session=document.getElementById("session");
const cardEl=document.getElementById("card"),promptEl=document.getElementById("prompt"),answerEl=document.getElementById("answer");
const autoBtn=document.getElementById("autoBtn"),soundBtn=document.getElementById("soundBtn");
const soundIcon=document.getElementById("soundIcon"),ambientWash=document.getElementById("ambientWash");

function ensureAudio(){
  try{
    if(!audioCtx){
      const A=window.AudioContext||window.webkitAudioContext;
      if(A) audioCtx=new A();
    }
    if(audioCtx && audioCtx.state==="suspended") audioCtx.resume();
  }catch(e){}
}
function startAmbientSound(){
  if(!sound)return;
  try{
    ensureAudio();
    if(!audioCtx || ambientMaster)return;

    ambientMaster=audioCtx.createGain();
    ambientMaster.gain.setValueAtTime(.0001,audioCtx.currentTime);
    ambientMaster.gain.exponentialRampToValueAtTime(.0105,audioCtx.currentTime+2.8);
    ambientMaster.connect(audioCtx.destination);

    const g432=audioCtx.createGain();
    const g216=audioCtx.createGain();
    g432.gain.value=.72;
    g216.gain.value=.28;

    ambientOsc432=audioCtx.createOscillator();
    ambientOsc216=audioCtx.createOscillator();
    ambientOsc432.type="sine";
    ambientOsc216.type="sine";

    // 432 Hz remains the primary frequency. The quiet 216 Hz subharmonic
    // adds warmth so the sustained tone feels ambient rather than like an alert.
    ambientOsc432.frequency.setValueAtTime(432,audioCtx.currentTime);
    ambientOsc216.frequency.setValueAtTime(216,audioCtx.currentTime);

    ambientOsc432.connect(g432);
    ambientOsc216.connect(g216);
    g432.connect(ambientMaster);
    g216.connect(ambientMaster);

    ambientOsc432.start();
    ambientOsc216.start();
  }catch(e){}
}
function stopAmbientSound(){
  try{
    if(!audioCtx || !ambientMaster)return;
    const master=ambientMaster,o432=ambientOsc432,o216=ambientOsc216;
    const now=audioCtx.currentTime;
    master.gain.cancelScheduledValues(now);
    master.gain.setValueAtTime(Math.max(master.gain.value,.0001),now);
    master.gain.exponentialRampToValueAtTime(.0001,now+2.2);
    setTimeout(()=>{
      try{o432&&o432.stop();}catch(e){}
      try{o216&&o216.stop();}catch(e){}
      try{master.disconnect();}catch(e){}
      ambientMaster=null;ambientOsc432=null;ambientOsc216=null;
    },2300);
  }catch(e){}
}
function ambientCue(){
  ambientWash.classList.remove("cue");
  void ambientWash.offsetWidth;
  ambientWash.classList.add("cue");
}
function pulse(){if(navigator.vibrate)navigator.vibrate(12)}
function render(anim=true){
  promptEl.textContent=cards[i][0];answerEl.textContent=cards[i][1];
  answerEl.classList.toggle("show",revealed);
  if(anim){
    promptEl.classList.remove("fade");answerEl.classList.remove("fade");
    void promptEl.offsetWidth;promptEl.classList.add("fade");answerEl.classList.add("fade");
  }
}
function resetTimer(){
  clearInterval(timer);
  if(autoplay) timer=setInterval(()=>advance(),4300);
}
async function moveTo(nextIndex){
  if(transitioning)return;
  transitioning=true;

  cardEl.classList.remove("prompt-preenter","prompt-closing","answer-closing");

  // Gold response leaves in one smooth motion.
  if(revealed){
    cardEl.classList.add("answer-closing");
    await new Promise(r=>setTimeout(r,1320));
  }

  // White prompt leaves in the same gentle motion.
  cardEl.classList.add("prompt-closing");
  await new Promise(r=>setTimeout(r,1200));

  // Brief quiet separation between thoughts.
  await new Promise(r=>setTimeout(r,260));

  i=(nextIndex+cards.length)%cards.length;
  revealed=false;

  // Hold the new prompt fully hidden before allowing its single fade-in.
  cardEl.classList.remove("answer-closing","prompt-closing");
  cardEl.classList.add("prompt-preenter");
  promptEl.textContent=cards[i][0];
  answerEl.textContent=cards[i][1];
  answerEl.classList.remove("show");

  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  cardEl.classList.remove("prompt-preenter");
  ambientCue();pulse();

  await new Promise(r=>setTimeout(r,1220));
  transitioning=false;
}
function advance(){
  if(transitioning)return;
  if(!revealed){
    revealed=true;
    answerEl.classList.add("show");
    ambientCue();pulse();
  } else {
    moveTo(i+1);
  }
}
function previous(){
  if(transitioning)return;
  if(revealed){
    revealed=false;
    answerEl.classList.remove("show");
    return;
  }
  if(i===0){showLanding();return;}
  moveTo(i-1);
}
function startSession(){
  landing.classList.add("hidden");session.classList.remove("hidden");
  i=0;revealed=false;transitioning=false;render(false);ambientCue();resetTimer();
}
function showLanding(){
  clearInterval(timer);session.classList.add("hidden");landing.classList.remove("hidden");
}
async function shareApp(){
  const data={title:"I AM — Core Alignment",text:"A grounding and reflection experience.",url:location.href};
  try{
    if(navigator.share){await navigator.share(data);return;}
    await navigator.clipboard.writeText(location.href);alert("Link copied.");
  }catch(e){if(e?.name!=="AbortError")prompt("Copy this link:",location.href);}
}
document.getElementById("begin").onclick=startSession;
document.getElementById("shareLanding").onclick=shareApp;
document.getElementById("card").onclick=()=>{advance();resetTimer()};
document.getElementById("card").onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();advance();resetTimer()}};
document.getElementById("backBtn").onclick=()=>{previous();resetTimer()};
autoBtn.onclick=()=>{
  autoplay=!autoplay;
  autoBtn.querySelector("span").textContent=autoplay?"AUTOPLAY ON":"AUTOPLAY OFF";
  resetTimer();
};
soundBtn.onclick=()=>{
  sound=!sound;
  soundBtn.querySelector("span").textContent=sound?"SOUND ON":"SOUND OFF";
  soundIcon.innerHTML=sound?'<path d="M5 10v4h4l5 4V6l-5 4H5"/><path d="M17 9c1.5 1.5 1.5 4.5 0 6"/><path d="M19.5 6.5c3 3 3 8 0 11"/>':'<path d="M5 10v4h4l5 4V6l-5 4H5"/><path d="M18 9l4 6M22 9l-4 6"/>';
  if(sound)startAmbientSound();
  else stopAmbientSound();
};
const touch=document.getElementById("touchArea");
touch.addEventListener("touchstart",e=>{const t=e.changedTouches[0];startX=t.clientX;startY=t.clientY},{passive:true});
touch.addEventListener("touchend",e=>{
  const t=e.changedTouches[0],dx=t.clientX-startX,dy=t.clientY-startY;
  if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)){
    if(dx<0){advance();}
    else previous();
    resetTimer();
  }
},{passive:true});
</script>
</body>
</html>
