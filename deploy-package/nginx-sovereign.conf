# =============================================================================
# Sovereign Office — nginx reverse proxy config  (HTTP bootstrap version)
#
# DEPLOY INSTRUCTIONS — two phases:
#
# Phase 1 — deploy this file and verify nginx starts (no TLS yet):
#   sudo cp nginx-sovereign.conf /etc/nginx/sites-available/sovereign-office
#   sudo ln -sf /etc/nginx/sites-available/sovereign-office \
#               /etc/nginx/sites-enabled/sovereign-office
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Phase 2 — issue TLS certs; Certbot rewrites this file to add 443 blocks:
#   sudo certbot --nginx \
#     -d api.sovereignoffice.org \
#     -d sovereign.sovereignoffice.org \
#     -d trust.sovereignoffice.org \
#     -d community.sovereignoffice.org \
#     -d atlas.sovereignoffice.org
#
# After Phase 2 the file will contain Certbot-managed ssl_certificate directives
# and HTTP→HTTPS redirect blocks automatically.
#
# Replace sovereignoffice.org with your actual registered domain throughout.
# =============================================================================

# ── API Server (port 8080) ────────────────────────────────────────────────────
server {
    listen 80;
    server_name api.sovereignoffice.org;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

