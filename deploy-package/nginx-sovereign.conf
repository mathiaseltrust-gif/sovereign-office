# =============================================================================
# Sovereign Office — nginx reverse proxy config  (HTTP bootstrap version)
#
# DEPLOY INSTRUCTIONS — two phases:
#
# Phase 1 — deploy this file and verify nginx starts (no TLS yet):
#   sudo cp nginx-sovereign.conf /etc/nginx/sites-available/sovereign-office
#   sudo ln -sf /etc/nginx/sites-available/sovereign-office \
#               /etc/nginx/sites-enabled/sovereign-office
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Phase 2 — issue TLS certs; Certbot rewrites this file to add 443 blocks:
#   sudo certbot --nginx \
#     -d office.mathiaseltribe.org \
#     -d api.mathiaseltribe.org
#
# After Phase 2 the file will contain Certbot-managed ssl_certificate directives
# and HTTP→HTTPS redirect blocks automatically.
# =============================================================================

# ── API Server (port 8080) ────────────────────────────────────────────────────
server {
    client_max_body_size 100M;
    listen 80;
    server_name api.mathiaseltribe.org api.sovereignoffice.org;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# ── Primary: office.mathiaseltribe.org (port 3001 → gateway → sovereign) ─────
#
# All modules are served under this single domain via path prefixes:
#   /           → Sovereign Office Dashboard
#   /trust/     → Trust Instruments Dashboard
#   /community/ → Family & Community Dashboard
#   /atlas/     → Urban Indian Continuity Atlas
#   /authority/ → Authority Directory & Oversight Routing
#   /trace/     → TRACE — APA/CFR Compliance Engine
#
server {
    client_max_body_size 100M;
    listen 80;
    server_name office.mathiaseltribe.org;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# ── Legacy subdomain aliases (backward compat — redirect to office paths) ─────

server {
    client_max_body_size 100M;
    listen 80;
    server_name sovereign.sovereignoffice.org;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    return 301 https://office.mathiaseltribe.org$request_uri;
}

server {
    client_max_body_size 100M;
