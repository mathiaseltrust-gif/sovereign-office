name: Fix DB Password & Restart API

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Update DATABASE_URL and restart API
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 3m
          script: |
            ENV_FILE=/opt/sovereign-office/.env

            echo "=== Current DATABASE_URL (scheme only) ==="
            grep DATABASE_URL "$ENV_FILE" | cut -d'/' -f1-3 | sed 's|:[^@]*@|:***@|g'

            echo "=== Updating password for tribaladmin ==="
            # Handle both postgres:// and postgresql:// schemes, any password
            sed -i -E 's|(postgres[ql]*://tribaladmin:)[^@]*(@)|\1ElevatedTrust2026\2|g' "$ENV_FILE"

            echo "=== Verification: scheme + user (no password shown) ==="
            grep DATABASE_URL "$ENV_FILE" | sed -E 's|(postgres[ql]*://[^:]+:)[^@]+(@)|\1***\2|g'

            echo "=== Stopping and removing old API container ==="
            cd /opt/sovereign-office
            docker compose -f docker-compose.prod.yml rm -sf api

            echo "=== Starting API container fresh ==="
            docker compose -f docker-compose.prod.yml up -d api

            echo "=== Waiting 30s for API to initialise ==="
            sleep 30

            echo "=== Container status ==="
            docker ps --filter "name=api" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

            echo "=== API health check ==="
            curl -sf --max-time 10 http://localhost:8080/api/healthz \
              && echo "HEALTHY - API is up" \
              || echo "NOT YET HEALTHY"

            echo "=== API logs (last 40 lines) ==="
            docker logs sovereign-office-api-1 --tail 40 2>&1
