name: Certbot — community.mathiaseltribe.org
on:
  workflow_dispatch:

jobs:
  certbot:
    name: Issue SSL cert for community subdomain
    runs-on: ubuntu-latest
    steps:
      - name: Run certbot via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            sudo certbot --nginx -d community.mathiaseltribe.org --non-interactive --agree-tos --email admin@mathiaseltribe.org
            sudo nginx -t && sudo systemctl reload nginx
