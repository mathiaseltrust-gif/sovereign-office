name: Certbot — authority.mathiaseltribe.org
on:
  workflow_dispatch:

jobs:
  certbot:
    name: Issue SSL cert for authority subdomain
    runs-on: ubuntu-latest
    steps:
      - name: Run certbot via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            sudo certbot --nginx -d authority.mathiaseltribe.org --non-interactive --agree-tos --email admin@mathiaseltribe.org || \
            sudo certbot --nginx -d authority.mathiaseltribe.org --non-interactive --agree-tos --register-unsafely-without-email
            sudo nginx -t && sudo systemctl reload nginx
            echo "=== Done. Checking https://authority.mathiaseltribe.org ==="
            curl -sk -o /dev/null -w "HTTP %{http_code}" https://authority.mathiaseltribe.org || true
