name: Patch Atlas Life Event Coordinates

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/patch-atlas-life-event-coords.yml'

permissions:
  contents: write

jobs:
  patch-atlas-life-event-coords:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch Atlas API and frontend coordinate flow
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, path: str) -> str:
              if old not in text:
                  raise SystemExit(f"Expected block not found in {path}:\n{old}")
              return text.replace(old, new, 1)

          api_path = Path('artifacts/api-server/src/routes/atlas/index.ts')
          api = api_path.read_text()
          api = replace_once(api,
          '''          country,
          source_type AS "sourceType",
          source_reference AS "sourceReference"''',
          '''          country,
          latitude,
          longitude,
          source_type AS "sourceType",
          source_reference AS "sourceReference"''',
          str(api_path))
          api = replace_once(api,
          '''        country: string | null;
        sourceType: string | null;
        sourceReference: string | null;''',
          '''        country: string | null;
        latitude: number | string | null;
        longitude: number | string | null;
        sourceType: string | null;
        sourceReference: string | null;''',
          str(api_path))
          api = replace_once(api,
          '''          country: row.country,
          sourceType: row.sourceType,
          sourceReference: row.sourceReference,''',
          '''          country: row.country,
          latitude: row.latitude,
          longitude: row.longitude,
          sourceType: row.sourceType,
          sourceReference: row.sourceReference,''',
          str(api_path))
          api_path.write_text(api)

          panel_path = Path('artifacts/urban-indian-atlas/src/components/PersonContextPanel.tsx')
          panel = panel_path.read_text()
          panel = replace_once(panel,
          '''    coordinate_lat?: number | string | null;
    coordinate_lng?: number | string | null;
    lat?: number | string | null;
    lng?: number | string | null;''',
          '''    coordinate_lat?: number | string | null;
    coordinate_lng?: number | string | null;
    latitude?: number | string | null;
    longitude?: number | string | null;
    lat?: number | string | null;
    lng?: number | string | null;''',
          str(panel_path))
          panel = replace_once(panel,
          '''  const lat = raw.coordinateLat ?? raw.coordinate_lat ?? raw.lat ?? null;
  const lng = raw.coordinateLng ?? raw.coordinate_lng ?? raw.lng ?? null;''',
          '''  const lat = raw.coordinateLat ?? raw.coordinate_lat ?? raw.latitude ?? raw.lat ?? null;
  const lng = raw.coordinateLng ?? raw.coordinate_lng ?? raw.longitude ?? raw.lng ?? null;''',
          str(panel_path))
          panel_path.write_text(panel)

          atlas_path = Path('artifacts/urban-indian-atlas/src/pages/atlas.tsx')
          atlas = atlas_path.read_text()
          atlas = replace_once(atlas,
          '''  sourceType?: string | null;
  source_type?: string | null;
  sourceReference?: string | null;
  source_reference?: string | null;''',
          '''  sourceType?: string | null;
  source_type?: string | null;
  sourceReference?: string | null;
  source_reference?: string | null;
  coordinateLat?: number | string | null;
  coordinateLng?: number | string | null;
  coordinate_lat?: number | string | null;
  coordinate_lng?: number | string | null;
  latitude?: number | string | null;
  longitude?: number | string | null;
  lat?: number | string | null;
  lng?: number | string | null;''',
          str(atlas_path))
          atlas = replace_once(atlas,
          '''function ancestorMatchesExposureFilters(
  ancestor: AncestorRecord,
  contextMatches: AncestorContextMatch[],
  activeFilters: string[]
): boolean {''',
          '''function parseCoordPair(lat: unknown, lng: unknown): [number, number] | null {
  if (lat == null || lng == null) return null;
  const parsedLat = Number(lat);
  const parsedLng = Number(lng);
  return Number.isFinite(parsedLat) && Number.isFinite(parsedLng) ? [parsedLat, parsedLng] : null;
}

function coordFromLifeEvent(event: AncestorLifeEvent): [number, number] | null {
  const raw = event as AncestorLifeEvent & {
    coordinateLat?: number | string | null;
    coordinateLng?: number | string | null;
    coordinate_lat?: number | string | null;
    coordinate_lng?: number | string | null;
    latitude?: number | string | null;
    longitude?: number | string | null;
    lat?: number | string | null;
    lng?: number | string | null;
  };
  return parseCoordPair(
    raw.coordinateLat ?? raw.coordinate_lat ?? raw.latitude ?? raw.lat ?? null,
    raw.coordinateLng ?? raw.coordinate_lng ?? raw.longitude ?? raw.lng ?? null,
  );
}

function bestFocusCoordsForAncestor(ancestor: AncestorRecord): [number, number] | null {
  // Current/profile coordinates remain highest priority for living household members.
  const profileCoords = parseCoordPair(ancestor.locationLat, ancestor.locationLng);
  if (profileCoords) return profileCoords;

  const lifeEventCoords = (ancestor.lifeEvents ?? [])
    .map(coordFromLifeEvent)
    .find((coords): coords is [number, number] => coords !== null);
  if (lifeEventCoords) return lifeEventCoords;

  return null;
}

function ancestorMatchesExposureFilters(
  ancestor: AncestorRecord,
  contextMatches: AncestorContextMatch[],
  activeFilters: string[]
): boolean {''',
          str(atlas_path))
          atlas = replace_once(atlas,
          '''  const handleSelectPerson = (id: number) => {
    setSelectedPersonId(id);
    setSelectedEventId(null);
    setClusterResultsMembers(null);
  };''',
          '''  const handleSelectPerson = (id: number) => {
    const person = ancestors.find((a) => a.id === id) ?? filteredAncestors.find((a) => a.id === id) ?? null;
    setSelectedPersonId(id);
    setSelectedEventId(null);
    setClusterResultsMembers(null);
    setFocusedEventCoords(person ? bestFocusCoordsForAncestor(person) : null);
    setRightPanelHidden(false);
  };''',
          str(atlas_path))
          atlas_path.write_text(atlas)
          PY

      - name: Show changed files
        run: git diff --stat && git diff --check

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/routes/atlas/index.ts \
                  artifacts/urban-indian-atlas/src/pages/atlas.tsx \
                  artifacts/urban-indian-atlas/src/components/PersonContextPanel.tsx
          git commit -m "Fix Atlas person life event coordinate flow"
          git push
