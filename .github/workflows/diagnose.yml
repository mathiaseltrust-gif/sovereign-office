name: VM Diagnostics

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Deep diagnostics via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 5m
          script: |
            echo "=== CONTAINER STATUS ==="
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

            echo ""
            echo "=== ATLAS EVENTS — direct API call ==="
            curl -sf --max-time 10 http://localhost:8080/api/atlas/events \
              && echo "" || echo "FAILED: direct API call"

            echo ""
            echo "=== ATLAS EVENTS — through atlas nginx (simulates browser path) ==="
            docker exec sovereign-office-atlas-1 \
              wget -qO- http://localhost:80/api/atlas/events 2>&1 || echo "FAILED: atlas nginx path"

            echo ""
            echo "=== MICROSOFT AUTH CONFIG ==="
            curl -sf --max-time 10 http://localhost:8080/api/auth/microsoft/config || echo "FAILED"

            echo ""
            echo "=== API recent logs (auth + atlas entries) ==="
            docker logs sovereign-office-api-1 --tail 60 2>&1 | \
              grep -E '"url".*auth|"url".*atlas|error|Error|exchange|AADSTS|redirect' | tail -30

            echo ""
            echo "=== CERT SAN CHECK ==="
            openssl s_client -connect localhost:3001 </dev/null 2>/dev/null | \
              openssl x509 -noout -text 2>/dev/null | grep -A2 "Subject Alternative"

            echo ""
            echo "=== ENV VARS PRESENT (no values shown) ==="
            docker exec sovereign-office-api-1 env | grep -E "^AZURE_|^MICROSOFT_|^SESSION_|^SOVEREIGN_" | sed 's/=.*/=SET/'
