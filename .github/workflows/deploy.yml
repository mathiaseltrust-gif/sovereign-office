# ============================================================================
# Sovereign Office — CI/CD Pipeline
#
# Triggers on every push to `main` (production) and `staging`.
#
# What it does:
#   1. Builds all four Docker images (api, sovereign, trust, community)
#   2. Pushes each image to Azure Container Registry (ACR) with two tags:
#        - <git-sha>  — immutable, pinned to this exact commit
#        - latest     — floating tag always pointing at the newest build
#   3. SSHs into the Azure VM and performs a rolling restart:
#        runs DB schema migrations, pulls new images, restarts each service.
#
# Required GitHub repository secrets (Settings → Secrets and variables → Actions):
#
#   ACR_REGISTRY      Azure Container Registry login server
#                     e.g. sovereignoffice.azurecr.io
#   ACR_USERNAME      ACR admin username
#   ACR_PASSWORD      ACR admin password
#   DEPLOY_HOST       Public IP of the Azure VM  e.g. 20.83.210.26
#   DEPLOY_USER       SSH login user on the VM   e.g. azureuser
#   DEPLOY_SSH_KEY    Full PEM-encoded private key matching an authorised_key on the VM
#   DEPLOY_PATH       Absolute path on the VM    e.g. /opt/sovereign-office
#
# Optional secrets for health-check failure alerts (add at least one):
#
#   SLACK_WEBHOOK_URL  Incoming Webhook URL from your Slack app
#                      e.g. https://hooks.slack.com/services/T.../B.../xxx
#   NOTIFY_EMAIL       Recipient address for failure emails e.g. ops@sovereignoffice.org
#   SMTP_HOST          SMTP server hostname          e.g. smtp.sendgrid.net
#   SMTP_PORT          SMTP server port              e.g. 587
#   SMTP_USERNAME      SMTP auth username            e.g. apikey
#   SMTP_PASSWORD      SMTP auth password / API key
#
# Staging requires the same secrets defined in the `staging` GitHub Actions
# environment (Settings → Environments → staging → Secrets):
#
#   ACR_REGISTRY, ACR_USERNAME, ACR_PASSWORD   (may share production ACR)
#   DEPLOY_HOST       IP of the staging VM
#   DEPLOY_USER       SSH login user on the staging VM
#   DEPLOY_SSH_KEY    Private key for the staging VM
#   DEPLOY_PATH       Absolute path on the staging VM  e.g. /opt/sovereign-office-staging
#
#   The alert secrets (SLACK_WEBHOOK_URL, NOTIFY_EMAIL, SMTP_*) can also be
#   added to the staging environment to receive failure alerts for staging deploys.
# ============================================================================

name: Build & Deploy

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ${{ secrets.ACR_REGISTRY }}

  # ── Production domain names — SINGLE SOURCE OF TRUTH ─────────────────────
  # All modules are served under office.mathiaseltribe.org via path-based routing.
  # To change a URL, update the matching GitHub Actions variable under
  # Settings → Secrets and variables → Actions → Variables, then update the
  # fallback default here.  These values are referenced by every build-args
  # block and by the HTTPS health-check step below — no other edits needed.
  #
  #   Variable name   │ Example value
  #   ────────────────┼─────────────────────────────────────────────────────
  #   VITE_API_URL    │ https://office.mathiaseltribe.org/api
  #   SOVEREIGN_URL   │ https://office.mathiaseltribe.org
  #   TRUST_URL       │ https://office.mathiaseltribe.org/trust/
  #   COMMUNITY_URL   │ https://office.mathiaseltribe.org/community/
  #   ATLAS_URL       │ https://office.mathiaseltribe.org/atlas/
  #   AUTHORITY_URL   │ https://office.mathiaseltribe.org/authority/
  # ─────────────────────────────────────────────────────────────────────────
  # Production is path-based under one host. Keep these canonical here so stale
  # repository variables cannot redirect smoke tests to unused subdomains.
  VITE_API_URL:    https://office.mathiaseltribe.org
  SOVEREIGN_URL:   https://office.mathiaseltribe.org
  TRUST_URL:       https://office.mathiaseltribe.org/trust/
  COMMUNITY_URL:   https://office.mathiaseltribe.org/community/
  ATLAS_URL:       https://office.mathiaseltribe.org/atlas/
  AUTHORITY_URL:   https://office.mathiaseltribe.org/authority/
  TRACE_URL:       https://office.mathiaseltribe.org/trace/

jobs:
  # ── 0. Validate the workspace before any image is published ───────────────
  validate:
    name: "Validate workspace"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck workspace
        run: pnpm run typecheck

      - name: Build production services
        run: |
          pnpm -r \
            --filter @workspace/api-server \
            --filter @workspace/sovereign-dashboard \
            --filter @workspace/trust-dashboard \
            --filter @workspace/community-dashboard \
            --filter @workspace/urban-indian-atlas \
            --filter @workspace/trace \
            --filter @workspace/authority-directory \
            --if-present run build

  # ════════════════════════════════════════════════════════════════════════════
  # PRODUCTION  (main branch only)
  # ════════════════════════════════════════════════════════════════════════════

  # ── 1. Build and push all images (production) ─────────────────────────────
  build-and-push:
    name: "[prod] Build & Push Docker images"
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main'

    outputs:
      image_tag: ${{ steps.meta.outputs.sha_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "sha_tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Validate required URL variables
        env:
          # Use vars.* directly — NOT env.* — so that a missing GitHub Actions
          # variable produces an empty string here rather than the fallback
          # default defined in the top-level env: block.
          RAW_VITE_API_URL:    ${{ env.VITE_API_URL }}
          RAW_SOVEREIGN_URL:   ${{ env.SOVEREIGN_URL }}
          RAW_TRUST_URL:       ${{ env.TRUST_URL }}
          RAW_COMMUNITY_URL:   ${{ env.COMMUNITY_URL }}
          RAW_ATLAS_URL:       ${{ env.ATLAS_URL }}
          RAW_AUTHORITY_URL:   ${{ env.AUTHORITY_URL }}
        run: |
          set -euo pipefail
          FAIL=0

          check_url_var() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "ERROR: $name is not set. Add it under Settings → Secrets and variables → Actions → Variables." >&2
              FAIL=1
            elif [[ "$value" != https://* ]]; then
              echo "ERROR: $name must start with https:// for production (got: $value)." >&2
              FAIL=1
            else
              echo "  ✓ $name = $value"
            fi
          }

          check_url_var_optional() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "  ⚠ $name not set — will use default (https://office.mathiaseltribe.org/authority/)"
            elif [[ "$value" != https://* ]]; then
              echo "ERROR: $name must start with https:// for production (got: $value)." >&2
              FAIL=1
            else
              echo "  ✓ $name = $value"
            fi
          }

          echo "==> Validating required URL variables..."
          check_url_var "VITE_API_URL"  "$RAW_VITE_API_URL"
          check_url_var "SOVEREIGN_URL" "$RAW_SOVEREIGN_URL"
          check_url_var "TRUST_URL"     "$RAW_TRUST_URL"
          check_url_var "COMMUNITY_URL" "$RAW_COMMUNITY_URL"
          check_url_var "ATLAS_URL"     "$RAW_ATLAS_URL"
          check_url_var_optional "AUTHORITY_URL" "$RAW_AUTHORITY_URL"

          if [ "$FAIL" -ne 0 ]; then
            echo ""
            echo "One or more required URL variables are missing or not HTTPS." >&2
            echo "Fix the GitHub Actions variable(s) listed above, then re-run the workflow." >&2
            exit 1
          fi
          echo "==> All required URL variables are valid."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # ── API Server ─────────────────────────────────────────────────────────
      - name: Build and push — api
        uses: docker/build-push-action@v5
        with:
          context: .
          file: artifacts/api-server/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/sovereign-api:${{ steps.meta.outputs.sha_tag }}
            ${{ env.REGISTRY }}/sovereign-api:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/sovereign-api:latest
          cache-to: type=inline

      # ── Sovereign Office Dashboard ─────────────────────────────────────────
      - name: Build and push — sovereign-dashboard
        uses: docker/build-push-action@v5
        with:
          context: .
          file: artifacts/sovereign-dashboard/Dockerfile
          push: true
          build-args: |
            BASE_PATH=/
            VITE_API_URL=${{ env.VITE_API_URL }}
          tags: |
            ${{ env.REGISTRY }}/sovereign-dashboard:${{ steps.meta.outputs.sha_tag }}
            ${{ env.REGISTRY }}/sovereign-dashboard:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/sovereign-dashboard:latest
          cache-to: type=inline

      # ── Trust Instruments Dashboard ────────────────────────────────────────
      - name: Build and push — trust-dashboard
        uses: docker/build-push-action@v5
        with:
          context: .
          file: artifacts/trust-dashboard/Dockerfile
          push: true
          build-args: |
            BASE_PATH=/trust/
            VITE_API_URL=${{ env.VITE_API_URL }}
          tags: |
            ${{ env.REGISTRY }}/trust-dashboard:${{ steps.meta.outputs.sha_tag }}
            ${{ env.REGISTRY }}/trust-dashboard:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/trust-dashboard:latest
          cache-to: type=inline

      # ── Family & Community Dashboard ───────────────────────────────────────
      - name: Build and push — community-dashboard
        uses: docker/build-push-action@v5
        with:
          context: .
          file: artifacts/community-dashboard/Dockerfile
          push: true
          build-args: |
            BASE_PATH=/community/
            VITE_API_URL=${{ env.VITE_API_URL }}
          tags: |
            ${{ env.REGISTRY }}/community-dashboard:${{ steps.meta.outputs.sha_tag }}
            ${{ env.REGISTRY }}/community-dashboard:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/community-dashboard:latest
          cache-to: type=inline

      # ── Urban Indian Continuity Atlas ───────────────────────────────────────
      - name: Build and push — urban-indian-atlas
        uses: docker/build-push-action@v5
        with:
          context: .
          file: artifacts/urban-indian-atlas/Dockerfile
          push: true
          build-args: |
            BASE_PATH=/atlas/
            VITE_API_URL=${{ env.VITE_API_URL }}
            VITE_CARTO_BASEMAP_KEY=${{ secrets.CARTO_BASEMAP_API_KEY }}
          tags: |
            ${{ env.REGISTRY }}/urban-indian-atlas:${{ steps.meta.outputs.sha_tag }}
            ${{ env.REGISTRY }}/urban-indian-atlas:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/urban-indian-atlas:latest
          cache-to: type=inline

      # ── TRACE — APA/CFR Compliance Engine ──────────────────────────────────
      - name: Build and push — trace
        uses: docker/build-push-action@v5
        with:
          context: .
          file: artifacts/trace/Dockerfile
          push: true
          build-args: |
            BASE_PATH=/trace/
            VITE_API_URL=${{ env.VITE_API_URL }}
          tags: |
            ${{ env.REGISTRY }}/trace:${{ steps.meta.outputs.sha_tag }}
            ${{ env.REGISTRY }}/trace:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/trace:latest
          cache-to: type=inline

      # ── Authority Directory & Oversight Routing Dashboard ──────────────────
      - name: Build and push — authority-directory
        uses: docker/build-push-action@v5
        with:
          context: .
          file: artifacts/authority-directory/Dockerfile
          push: true
          build-args: |
            BASE_PATH=/authority/
            VITE_API_URL=${{ env.VITE_API_URL }}
          tags: |
            ${{ env.REGISTRY }}/authority-directory:${{ steps.meta.outputs.sha_tag }}
            ${{ env.REGISTRY }}/authority-directory:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/authority-directory:latest
          cache-to: type=inline
          
      # ── SSL Gateway (nginx HTTPS termination on ports 3001-3005) ───────────
      - name: Build and push — sovereign-gateway
        uses: docker/build-push-action@v5
        with:
          context: deploy-package/gateway
          file: deploy-package/gateway/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/sovereign-gateway:${{ steps.meta.outputs.sha_tag }}
            ${{ env.REGISTRY }}/sovereign-gateway:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/sovereign-gateway:latest
          cache-to: type=inline

  # ── 2. Deploy to Azure VM via SSH (production) ────────────────────────────
  deploy:
    name: "[prod] Rolling restart on Azure VM"
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          script: |
            set -euo pipefail
            DEPLOY_DIR="${{ secrets.DEPLOY_PATH }}"
            if [ ! -d "$DEPLOY_DIR" ] && [ -d "/home/azureuser/sovereign-office" ]; then
              echo "Configured DEPLOY_PATH not found; using /home/azureuser/sovereign-office"
              DEPLOY_DIR="/home/azureuser/sovereign-office"
            elif [ ! -d "$DEPLOY_DIR" ] && [ -d "/opt/sovereign-office" ]; then
              echo "Configured DEPLOY_PATH not found; using /opt/sovereign-office"
              DEPLOY_DIR="/opt/sovereign-office"
            fi
            cd "$DEPLOY_DIR"

            # ── Inject/update runtime secrets in .env ─────────────────────────────
            # Writes or overwrites a single KEY=VALUE line in .env, creating the
            # file if needed.  Single-quotes around the GH-Actions substituted
            # values mean the shell sees them as literals (safe for GUIDs and most
            # client-secret character sets).
            _set_env() {
              local key="$1" val="$2" file=".env"
              touch "$file"
              { grep -v "^${key}=" "$file" || true; } > /tmp/.env_tmp && mv /tmp/.env_tmp "$file"
              printf '%s=%s\n' "$key" "$val" >> "$file"
            }

            echo "==> Updating .env with Entra + SSO credentials"
            _set_env AZURE_ENTRA_TENANT_ID     '${{ secrets.AZURE_ENTRA_TENANT_ID }}'
            _set_env AZURE_ENTRA_CLIENT_ID     '${{ secrets.AZURE_ENTRA_CLIENT_ID }}'
            _set_env AZURE_ENTRA_CLIENT_SECRET '${{ secrets.AZURE_ENTRA_CLIENT_SECRET }}'
            _set_env SOVEREIGN_DASHBOARD_URL   'https://office.mathiaseltribe.org'
            _set_env MICROSOFT_REDIRECT_URI     'https://office.mathiaseltribe.org/microsoft/callback'
            echo "==> .env updated (5 keys)"

            # ── Sync the exact compose file from the commit being deployed ─────
            echo "==> Syncing docker-compose.prod.yml from commit ${{ github.sha }}"
            TMP_COMPOSE="$(mktemp)"
            curl -fsSL --retry 3 --retry-delay 2 \
              "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/docker-compose.prod.yml" \
              -o "$TMP_COMPOSE"
            docker compose --env-file .env -f "$TMP_COMPOSE" config > /dev/null
            mv "$TMP_COMPOSE" docker-compose.prod.yml
            echo "==> compose file synced and validated"
            echo "==> Logging in to ACR"
            echo "${{ secrets.ACR_PASSWORD }}" | \
              docker login "${{ secrets.ACR_REGISTRY }}" \
                --username "${{ secrets.ACR_USERNAME }}" \
                --password-stdin

            echo "==> Pinning IMAGE_TAG to ${{ needs.build-and-push.outputs.image_tag }}"
            export IMAGE_TAG="${{ needs.build-and-push.outputs.image_tag }}"

            # ── Save previous tag as rollback target before we pull anything ─────
            # Written BEFORE the pull so that the rollback job always has a valid
            # reference to the last known-good images, independent of whether the
            # new deploy succeeds or fails.
            PREV_TAG=$(cat .last_good_tag 2>/dev/null | tr -d '[:space:]' || echo "")
            if [ -n "$PREV_TAG" ]; then
              printf '%s\n' "$PREV_TAG" > .rollback_tag
              echo "==> Last known-good tag: ${PREV_TAG} (saved in .rollback_tag)"
            else
              rm -f .rollback_tag
              echo "==> No previous tag found — first deploy, rollback will not be available"
            fi

            echo "==> Pulling new images (all seven services)"
            docker compose -f docker-compose.prod.yml pull api sovereign trust community atlas authority trace gateway

            # ── Run database schema migrations BEFORE starting the api ────────────
            # Runs migrate.mjs (compiled from artifacts/api-server/src/migrate.ts)
            # in a one-off container so no HTTP traffic is served until every
            # ALTER TABLE / CREATE TABLE IF NOT EXISTS has been applied.
            # Fails fast and aborts the deploy if any migration returns a real error
            # (non-idempotency failures are treated as fatal inside migrate.mjs).
            echo "==> Running database schema migrations..."
            # The api service already has entrypoint: ["node"], so pass only the script path.
            docker compose -f docker-compose.prod.yml run --rm --no-deps \
              api /app/dist/migrate.mjs
            echo "==> Migrations complete."

            echo "==> Starting / restarting all services"
            docker compose -f docker-compose.prod.yml up -d --no-build

            echo "==> Waiting up to 60 s for api to become healthy..."
            WAIT=0
            until docker compose -f docker-compose.prod.yml ps api 2>/dev/null | grep -q "healthy"; do
              sleep 5
              WAIT=$((WAIT+5))
              if [ "$WAIT" -ge 60 ]; then
                echo "  WARNING: api did not reach healthy state in 60s — printing diagnostics"
                echo "--- docker ps ---"
                docker ps --format "table {{.Names}}\t{{.Status}}"
                echo "--- api logs (last 30 lines) ---"
                docker compose -f docker-compose.prod.yml logs --tail=30 api || true
                echo "--- .env DATABASE_URL line ---"
                grep -i "DATABASE_URL\|POSTGRES" .env 2>/dev/null || echo "(no .env or var not set)"
                break
              fi
            done

            echo "==> Pruning unused images (keeps disk clean)"
            docker image prune -f


            # ── On-VM smoke test — all services must respond 2xx ─────────────────
            # Path-based routing: all dashboard modules are served through port 3001
            # (sovereign gateway → sovereign container which proxies by path prefix).
            # This is the first gate before the external smoke-test job.
            echo "==> On-VM smoke test — all services via path-based routing..."
            SMOKE_FAIL=0
            # API health check (plain HTTP, port 8080)
            if curl -sf --max-time 15 http://localhost:8080/api/healthz > /dev/null; then
              echo "  ✓ api (http :8080)"
            else
              echo "  ✗ api (http :8080) — health check FAILED"
              SMOKE_FAIL=1
            fi
            # All dashboard modules via SSL gateway on port 3001.
            # Use the production Host header because sub-app proxying is host-aware,
            # and allow a short warm-up window after all containers are recreated.
            for PATH_NAME in "/:sovereign" "/trust/:trust" "/community/:community" "/atlas/:atlas" "/authority/:authority" "/trace/:trace"; do
              PATH_PREFIX="${PATH_NAME%%:*}"
              NAME="${PATH_NAME##*:}"
              CODE="000"
              for ATTEMPT in 1 2 3 4 5 6; do
                CODE=$(curl -sk --max-time 15 -o /dev/null -w "%{http_code}" \
                  -H "Host: office.mathiaseltribe.org" \
                  "https://localhost:3001${PATH_PREFIX}" || true)
                case "$CODE" in
                  2??|3??) break ;;
                esac
                sleep 5
              done
              case "$CODE" in
                2??|3??)
                  echo "  ✓ $NAME (https :3001${PATH_PREFIX}) — HTTP $CODE"
                  ;;
                *)
                  echo "  ✗ $NAME (https :3001${PATH_PREFIX}) — HTTP $CODE after warm-up"
                  SMOKE_FAIL=1
                  ;;
              esac
            done
            if [ "$SMOKE_FAIL" -ne 0 ]; then
              echo "ERROR: One or more services failed the on-VM smoke test — deploy aborted." >&2
              echo "--- docker ps ---"
              docker compose -f docker-compose.prod.yml ps
              echo "--- service logs (last 30 lines) ---"
              docker compose -f docker-compose.prod.yml logs --tail=30 api sovereign trust community atlas authority trace gateway || true
              exit 1
            fi

            # ── Write last-known-good tag (only after all containers are healthy) ─
            echo "${{ needs.build-and-push.outputs.image_tag }}" > .last_good_tag
            echo "==> Saved last-good-tag: ${{ needs.build-and-push.outputs.image_tag }}"

            echo "==> Deploy complete. Running containers:"
            docker compose -f docker-compose.prod.yml ps

  # ── 3. Smoke test — all seven production endpoints (external, from GHA runner) ──
  #
  # Runs as a SEPARATE JOB after the `deploy` job so that:
  #   • It appears as its own named check in the GitHub Actions UI
  #   • A failure marks the entire workflow run as failed (no continue-on-error)
  #   • The `rollback` job can key off its failure via `needs: [smoke-test]`
  #
  # Only runs when VITE_API_URL is an https:// address (i.e. TLS is live).
  # When that variable is unset or http://, this job is skipped and the
  # on-VM smoke test inside the `deploy` SSH script is the only gate.
  #
  # Configure retry delay via the HEALTH_CHECK_RETRY_DELAY Actions variable
  # (default 10 s).  Set alert secrets to receive failure notifications:
  #   Slack  → SLACK_WEBHOOK_URL
  #   Email  → NOTIFY_EMAIL + SMTP_HOST + SMTP_PORT + SMTP_USERNAME + SMTP_PASSWORD
  smoke-test:
    name: "[prod] Smoke test — all seven public endpoints"
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main'

    outputs:
      failed_services: ${{ steps.check.outputs.failed_services }}

    steps:
      - name: Curl all seven public endpoints
        id: check
        env:
          API_URL:       ${{ env.VITE_API_URL }}
          SOVEREIGN_URL: ${{ env.SOVEREIGN_URL }}
          TRUST_URL:     ${{ env.TRUST_URL }}
          COMMUNITY_URL: ${{ env.COMMUNITY_URL }}
          ATLAS_URL:     ${{ env.ATLAS_URL }}
          AUTHORITY_URL: ${{ env.AUTHORITY_URL }}
          TRACE_URL:     ${{ env.TRACE_URL }}
          HEALTH_CHECK_RETRY_DELAY: ${{ vars.HEALTH_CHECK_RETRY_DELAY || '10' }}
        run: |
          set -euo pipefail
          FAIL=0
          FAILED_SERVICES=""
          RETRY_DELAY="${HEALTH_CHECK_RETRY_DELAY:-10}"

          check_url() {
            local label="$1"
            local url="$2"
            if [ -z "$url" ]; then
              echo "  ✗ $label — URL variable is not set (check GitHub Actions variables)"
              FAILED_SERVICES="${FAILED_SERVICES}${label}, "
              FAIL=1
              return
            fi
            local code
            code=$(curl -sf --max-time 15 -o /dev/null -w "%{http_code}" "$url" 2>/dev/null || echo "000")
            if [ "$code" = "200" ]; then
              echo "  ✓ $label — HTTP $code"
            else
              echo "  ↻ $label — HTTP $code, retrying in ${RETRY_DELAY}s…"
              sleep "$RETRY_DELAY"
              code=$(curl -sf --max-time 15 -o /dev/null -w "%{http_code}" "$url" 2>/dev/null || echo "000")
              if [ "$code" = "200" ]; then
                echo "  ✓ $label — HTTP $code (on retry)"
              else
                echo "  ✗ $label — HTTP $code  ($url)"
                FAILED_SERVICES="${FAILED_SERVICES}${label} (HTTP ${code}), "
                FAIL=1
              fi
            fi
          }

          echo "==> Smoke-testing all seven production endpoints..."
          check_url "api (healthz)"  "${API_URL%/}/api/healthz"
          check_url "sovereign"      "${SOVEREIGN_URL}"
          check_url "trust"          "${TRUST_URL}"
          check_url "community"      "${COMMUNITY_URL}"
          check_url "atlas"          "${ATLAS_URL}"
          check_url "authority"      "${AUTHORITY_URL}"
          check_url "trace"          "${TRACE_URL}"

          FAILED_SERVICES="${FAILED_SERVICES%, }"
          echo "failed_services=${FAILED_SERVICES}" >> "$GITHUB_OUTPUT"

          if [ "$FAIL" -ne 0 ]; then
            echo ""
            echo "Smoke test FAILED — non-2xx response from: ${FAILED_SERVICES}"
            echo "The rollback job will now attempt to revert to the last known-good images."
            exit 1
          fi
          echo "==> All six endpoints returned 200 — release is healthy."

      - name: Notify Slack — smoke test failed
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          FAILED_SERVICES:   ${{ steps.check.outputs.failed_services }}
          COMMIT_SHA:        ${{ github.sha }}
          RUN_URL:           ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not configured — skipping Slack notification"
            exit 0
          fi
          SHORT_SHA="${COMMIT_SHA::8}"
          BULLET_LIST=$(printf '%s' "${FAILED_SERVICES:-unknown}" | awk -F', ' '{for(i=1;i<=NF;i++) printf "• %s\\n", $i}')
          PAYLOAD=$(printf '{
            "text": ":rotating_light: *Production smoke test FAILED — rollback triggered*",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": ":rotating_light: *Production smoke test FAILED*\n*Commit:* `%s`\n*Failed services:*\n%s\nRolling back automatically. <%s|View workflow run \u2192>"
                }
              }
            ]
          }' "$SHORT_SHA" "$BULLET_LIST" "$RUN_URL")
          curl -sf -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD"
          echo "Slack notification sent."

      - name: Notify email — smoke test failed
        if: failure()
        env:
          NOTIFY_EMAIL:    ${{ secrets.NOTIFY_EMAIL }}
          SMTP_HOST:       ${{ secrets.SMTP_HOST }}
          SMTP_PORT:       ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME:   ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD:   ${{ secrets.SMTP_PASSWORD }}
          FAILED_SERVICES: ${{ steps.check.outputs.failed_services }}
          COMMIT_SHA:      ${{ github.sha }}
          RUN_URL:         ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$NOTIFY_EMAIL" ] || [ -z "$SMTP_HOST" ] || [ -z "$SMTP_USERNAME" ] || [ -z "$SMTP_PASSWORD" ]; then
            echo "Email secrets not fully configured — skipping email notification"
            exit 0
          fi
          SHORT_SHA="${COMMIT_SHA::8}"
          PORT="${SMTP_PORT:-587}"
          SUBJECT="[Sovereign Office] Production smoke test FAILED — ${SHORT_SHA}"
          BULLET_LIST=$(printf '%s' "${FAILED_SERVICES:-unknown}" | awk -F', ' '{for(i=1;i<=NF;i++) printf "  • %s\n", $i}')
          BODY="Production smoke test failed after deploying commit ${SHORT_SHA}.\n\nFailed services:\n${BULLET_LIST}\n\nAn automatic rollback to the last known-good images has been triggered.\n\nPlease review the workflow run for details:\n${RUN_URL}"
          printf '%b' "$BODY" | curl -sf \
            --url "smtp://${SMTP_HOST}:${PORT}" \
            --ssl-reqd \
            --user "${SMTP_USERNAME}:${SMTP_PASSWORD}" \
            --mail-from "${SMTP_USERNAME}" \
            --mail-rcpt "${NOTIFY_EMAIL}" \
            --upload-file - \
            --header "Subject: ${SUBJECT}" \
            --header "Content-Type: text/plain"
          echo "Email notification sent to ${NOTIFY_EMAIL}."

  # ── 4. Rollback — revert to last known-good images on smoke-test failure ──
  #
  # Triggered automatically when the `smoke-test` job fails.
  # Reads the image tag written to `.last_good_tag` by the PREVIOUS successful
  # deploy (the file is only written after all on-VM checks pass), then pulls
  # those images from ACR and restarts all services.
  #
  # If `.last_good_tag` does not exist (first-ever deploy), the job exits 1
  # with a clear message so the operator knows manual intervention is needed.
  rollback:
    name: "[prod] Rollback — revert to last known-good images"
    runs-on: ubuntu-latest
    needs: smoke-test
    if: failure() && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Rollback via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 5m
          script: |
            set -euo pipefail
            DEPLOY_DIR="${{ secrets.DEPLOY_PATH }}"
            if [ ! -d "$DEPLOY_DIR" ] && [ -d "/home/azureuser/sovereign-office" ]; then
              echo "Configured DEPLOY_PATH not found; using /home/azureuser/sovereign-office"
              DEPLOY_DIR="/home/azureuser/sovereign-office"
            elif [ ! -d "$DEPLOY_DIR" ] && [ -d "/opt/sovereign-office" ]; then
              echo "Configured DEPLOY_PATH not found; using /opt/sovereign-office"
              DEPLOY_DIR="/opt/sovereign-office"
            fi
            cd "$DEPLOY_DIR"

            ROLLBACK_TAG=$(cat .rollback_tag 2>/dev/null | tr -d '[:space:]' || echo "")
            if [ -z "$ROLLBACK_TAG" ]; then
              ROLLBACK_TAG=$(cat .last_good_tag 2>/dev/null | tr -d '[:space:]' || echo "")
            fi
            if [ -z "$ROLLBACK_TAG" ]; then
              echo "ERROR: .last_good_tag not found — no previous release to roll back to." >&2
              echo "This is likely the first deploy. Manual intervention required." >&2
              exit 1
            fi

            echo "==> Rolling back all services to image tag: ${ROLLBACK_TAG}"
            export IMAGE_TAG="$ROLLBACK_TAG"

            echo "==> Pulling rollback images from ACR..."
            docker compose -f docker-compose.prod.yml pull api sovereign trust community atlas authority trace gateway

            echo "==> Restarting all services with rollback images..."
            docker compose -f docker-compose.prod.yml up -d --no-build

            echo "==> Waiting up to 60 s for api to become healthy after rollback..."
            WAIT=0
            until docker compose -f docker-compose.prod.yml ps api 2>/dev/null | grep -q "healthy"; do
              sleep 5
              WAIT=$((WAIT+5))
              if [ "$WAIT" -ge 60 ]; then
                echo "  WARNING: api did not reach healthy state in 60s after rollback"
                docker compose -f docker-compose.prod.yml logs --tail=20 api || true
                break
              fi
            done

            printf '%s\n' "$ROLLBACK_TAG" > .last_good_tag
            echo "==> Rollback complete. Restored last-good tag: ${ROLLBACK_TAG}"
            docker compose -f docker-compose.prod.yml ps

  # ════════════════════════════════════════════════════════════════════════════
  # STAGING  (staging branch only)
  #
  # URL variables are defined in the `staging` GitHub Actions environment:
  #   Settings → Environments → staging → Variables
  #
  #   VITE_API_URL    │ https://api-staging.sovereignoffice.org
  #   SOVEREIGN_URL   │ https://sovereign-staging.sovereignoffice.org
  #   TRUST_URL       │ https://trust-staging.sovereignoffice.org
  #   COMMUNITY_URL   │ https://community-staging.sovereignoffice.org
  #   ATLAS_URL       │ https://atlas-staging.sovereignoffice.org
  #
  # Images are tagged with a `staging-` prefix to keep them separate from
  # production images in ACR.
  # ════════════════════════════════════════════════════════════════════════════

  # ── 1. Build and push all images (staging) ────────────────────────────────
  build-and-push-staging:
    name: "[staging] Build & Push Docker images"
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/staging'
    environment: staging

    outputs:
      image_tag: ${{ steps.meta.outputs.sha_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "sha_tag=staging-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Validate required URL variables
        env:
          # Use vars.* directly — NOT env.* — so that a missing GitHub Actions
          # variable produces an empty string here rather than the fallback
          # default defined in the top-level env: block.
          RAW_VITE_API_URL:    ${{ vars.VITE_API_URL }}
          RAW_SOVEREIGN_URL:   ${{ vars.SOVEREIGN_URL }}
          RAW_TRUST_URL:       ${{ vars.TRUST_URL }}
          RAW_COMMUNITY_URL:   ${{ vars.COMMUNITY_URL }}
          RAW_ATLAS_URL:       ${{ vars.ATLAS_URL }}
        run: |
          set -euo pipefail
          FAIL=0

          check_url_var() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "ERROR: $name is not set. Add it under Settings → Environments → staging → Variables." >&2
              FAIL=1
            elif [[ "$value" != https://* ]]; then
              echo "ERROR: $name must start with https:// for staging (got: $value)." >&2
              FAIL=1
            else
              echo "  ✓ $name = $value"
            fi
          }

          echo "==> Validating required URL variables..."
          check_url_var "VITE_API_URL"  "$RAW_VITE_API_URL"
          check_url_var "SOVEREIGN_URL" "$RAW_SOVEREIGN_URL"
          check_url_var "TRUST_URL"     "$RAW_TRUST_URL"
          check_url_var "COMMUNITY_URL" "$RAW_COMMUNITY_URL"
          check_url_var "ATLAS_URL"     "$RAW_ATLAS_URL"

          if [ "$FAIL" -ne 0 ]; then
            echo ""
            echo "One or more required URL variables are missing or not HTTPS." >&2
            echo "Fix the GitHub Actions variable(s) listed above, then re-run the workflow." >&2
            exit 1
          fi
          echo "==> All five URL variables are valid."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # ── API Server ─────────────────────────────────────────────────────────
      - name: Build and push — api
        uses: docker/build-push-action@v5
        with:
          context: .
          file: artifacts/api-server/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_REGISTRY }}/sovereign-api:${{ steps.meta.outputs.sha_tag }}
            ${{ secrets.ACR_REGISTRY }}/sovereign-api:staging
          cache-from: type=registry,ref=${{ secrets.ACR_REGISTRY }}/sovereign-api:staging
          cache-to: type=inline

      # ── Sovereign Office Dashboard ─────────────────────────────────────────
      - name: Build and push — sovereign-dashboard
        uses: docker/build-push-action@v5
        with:
          context: .
          file: artifacts/sovereign-dashboard/Dockerfile
          push: true
          build-args: |
            BASE_PATH=/
            VITE_API_URL=${{ vars.VITE_API_URL || 'https://api-staging.sovereignoffice.org' }}
          tags: |
            ${{ secrets.ACR_REGISTRY }}/sovereign-dashboard:${{ steps.meta.outputs.sha_tag }}
            ${{ secrets.ACR_REGISTRY }}/sovereign-dashboard:staging
          cache-from: type=registry,ref=${{ secrets.ACR_REGISTRY }}/sovereign-dashboard:staging
          cache-to: type=inline

      # ── Trust Instruments Dashboard ────────────────────────────────────────
      - name: Build and push — trust-dashboard
        uses: docker/build-push-action@v5
        with:
          context: .
          file: artifacts/trust-dashboard/Dockerfile
          push: true
          build-args: |
            BASE_PATH=/
            VITE_API_URL=${{ vars.VITE_API_URL || 'https://api-staging.sovereignoffice.org' }}
          tags: |
            ${{ secrets.ACR_REGISTRY }}/trust-dashboard:${{ steps.meta.outputs.sha_tag }}
            ${{ secrets.ACR_REGISTRY }}/trust-dashboard:staging
          cache-from: type=registry,ref=${{ secrets.ACR_REGISTRY }}/trust-dashboard:staging
          cache-to: type=inline

      # ── Family & Community Dashboard ───────────────────────────────────────
      - name: Build and push — community-dashboard
        uses: docker/build-push-action@v5
        with:
          context: .
          file: artifacts/community-dashboard/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || 'https://api-staging.sovereignoffice.org' }}
          tags: |
            ${{ secrets.ACR_REGISTRY }}/community-dashboard:${{ steps.meta.outputs.sha_tag }}
            ${{ secrets.ACR_REGISTRY }}/community-dashboard:staging
          cache-from: type=registry,ref=${{ secrets.ACR_REGISTRY }}/community-dashboard:staging
          cache-to: type=inline

      # ── Urban Indian Continuity Atlas ───────────────────────────────────────
      - name: Build and push — urban-indian-atlas
        uses: docker/build-push-action@v5
        with:
          context: .
          file: artifacts/urban-indian-atlas/Dockerfile
          push: true
          build-args: |
            BASE_PATH=/urban-indian-atlas/
            VITE_API_URL=${{ vars.VITE_API_URL || 'https://api-staging.sovereignoffice.org' }}
            VITE_CARTO_BASEMAP_KEY=${{ secrets.CARTO_BASEMAP_API_KEY }}
          tags: |
            ${{ secrets.ACR_REGISTRY }}/urban-indian-atlas:${{ steps.meta.outputs.sha_tag }}
            ${{ secrets.ACR_REGISTRY }}/urban-indian-atlas:staging
          cache-from: type=registry,ref=${{ secrets.ACR_REGISTRY }}/urban-indian-atlas:staging
          cache-to: type=inline

      # ── TRACE — APA/CFR Compliance Engine ──────────────────────────────────
      - name: Build and push — trace
        uses: docker/build-push-action@v5
        with:
          context: .
          file: artifacts/trace/Dockerfile
          push: true
          build-args: |
            BASE_PATH=/trace/
            VITE_API_URL=${{ vars.VITE_API_URL || 'https://api-staging.sovereignoffice.org' }}
          tags: |
            ${{ secrets.ACR_REGISTRY }}/trace:${{ steps.meta.outputs.sha_tag }}
            ${{ secrets.ACR_REGISTRY }}/trace:staging
          cache-from: type=registry,ref=${{ secrets.ACR_REGISTRY }}/trace:staging
          cache-to: type=inline

  # ── 2. Deploy to staging VM via SSH ───────────────────────────────────────
  deploy-staging:
    name: "[staging] Rolling restart on staging VM"
    runs-on: ubuntu-latest
    needs: build-and-push-staging
    environment: staging

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"

            # ── Inject/update runtime secrets in .env ─────────────────────────────
            _set_env() {
              local key="$1" val="$2" file=".env"
              touch "$file"
              { grep -v "^${key}=" "$file" || true; } > /tmp/.env_tmp && mv /tmp/.env_tmp "$file"
              printf '%s=%s\n' "$key" "$val" >> "$file"
            }
            echo "==> Updating .env with Entra + SSO credentials"
            _set_env AZURE_ENTRA_TENANT_ID     '${{ secrets.AZURE_ENTRA_TENANT_ID }}'
            _set_env AZURE_ENTRA_CLIENT_ID     '${{ secrets.AZURE_ENTRA_CLIENT_ID }}'
            _set_env AZURE_ENTRA_CLIENT_SECRET '${{ secrets.AZURE_ENTRA_CLIENT_SECRET }}'
            _set_env SOVEREIGN_DASHBOARD_URL   'https://office.mathiaseltribe.org'
            echo "==> .env updated (4 keys)"

            echo "==> Logging in to ACR"
            echo "${{ secrets.ACR_PASSWORD }}" | \
              docker login "${{ secrets.ACR_REGISTRY }}" \
                --username "${{ secrets.ACR_USERNAME }}" \
                --password-stdin

            echo "==> Pinning IMAGE_TAG to ${{ needs.build-and-push-staging.outputs.image_tag }}"
            export IMAGE_TAG="${{ needs.build-and-push-staging.outputs.image_tag }}"

            echo "==> Pulling new staging images (all five services)"
            docker compose -f docker-compose.prod.yml pull api sovereign trust community atlas

            echo "==> Rolling restart — api"
            docker compose -f docker-compose.prod.yml up -d --no-deps --no-build api
            echo "    Waiting for api to become healthy..."
            timeout 90 bash -c \
              'until docker compose -f docker-compose.prod.yml ps api | grep -q "healthy"; do sleep 3; done'

            echo "==> Rolling restart — sovereign dashboard"
            docker compose -f docker-compose.prod.yml up -d --no-deps --no-build sovereign

            echo "==> Rolling restart — trust dashboard"
            docker compose -f docker-compose.prod.yml up -d --no-deps --no-build trust

            echo "==> Rolling restart — community dashboard"
            docker compose -f docker-compose.prod.yml up -d --no-deps --no-build community

            echo "==> Rolling restart — urban indian atlas"
            docker compose -f docker-compose.prod.yml up -d --no-deps --no-build atlas

            echo "==> Pruning unused images (keeps disk clean)"
            docker image prune -f

            echo "==> Smoke-testing all five staging services..."
            SMOKE_FAIL=0
            # API health check
            if curl -sf --max-time 10 http://localhost:8080/api/healthz > /dev/null; then
              echo "  ✓ api (8080)"
            else
              echo "  ✗ api (8080) — health check FAILED"
              SMOKE_FAIL=1
            fi
            # Dashboard HTTP checks (nginx returns 200 for SPA index)
            for PORT_NAME in "3001:sovereign" "3002:trust" "3003:community" "3004:atlas"; do
              PORT="${PORT_NAME%%:*}"
              NAME="${PORT_NAME##*:}"
              CODE=$(curl -sf --max-time 10 -o /dev/null -w "%{http_code}" http://localhost:$PORT/ || echo "000")
              if [ "$CODE" = "200" ]; then
                echo "  ✓ $NAME ($PORT)"
              else
                echo "  ✗ $NAME ($PORT) — HTTP $CODE"
                SMOKE_FAIL=1
              fi
            done
            [ "$SMOKE_FAIL" -eq 0 ] || { echo "One or more staging services failed smoke test"; exit 1; }

            echo "==> Staging deploy complete. Running containers:"
            docker compose -f docker-compose.prod.yml ps

      # ── 3. External HTTPS health check for staging ────────────────────────
      # Reads URLs from the `staging` GitHub Actions environment variables.
      # Skipped when VITE_API_URL is still an http:// address or unset.
      - name: HTTPS health check — all five staging endpoints
        id: healthcheck
        if: vars.VITE_API_URL != '' && startsWith(vars.VITE_API_URL, 'https://')
        env:
          API_URL:       ${{ vars.VITE_API_URL    || 'https://api-staging.sovereignoffice.org' }}
          SOVEREIGN_URL: ${{ vars.SOVEREIGN_URL   || 'https://sovereign-staging.sovereignoffice.org' }}
          TRUST_URL:     ${{ vars.TRUST_URL       || 'https://trust-staging.sovereignoffice.org' }}
          COMMUNITY_URL: ${{ vars.COMMUNITY_URL   || 'https://community-staging.sovereignoffice.org' }}
          ATLAS_URL:     ${{ vars.ATLAS_URL       || 'https://atlas-staging.sovereignoffice.org' }}
        run: |
          set -euo pipefail
          FAIL=0
          FAILED_SERVICES=""

          check_url() {
            local label="$1"
            local url="$2"
            if [ -z "$url" ]; then
              echo "  ✗ $label — URL variable is not set (check staging environment variables)"
              FAILED_SERVICES="${FAILED_SERVICES}${label}, "
              FAIL=1
              return
            fi
            local code
            code=$(curl -sf --max-time 15 -o /dev/null -w "%{http_code}" "$url" 2>/dev/null || echo "000")
            if [ "$code" = "200" ]; then
              echo "  ✓ $label — HTTP $code"
            else
              echo "  ✗ $label — HTTP $code  ($url)"
              FAILED_SERVICES="${FAILED_SERVICES}${label} (HTTP ${code}), "
              FAIL=1
            fi
          }

          echo "==> Checking staging HTTPS endpoints..."
          check_url "api (healthz)"  "${API_URL%/}/api/healthz"
          check_url "sovereign"      "${SOVEREIGN_URL}"
          check_url "trust"          "${TRUST_URL}"
          check_url "community"      "${COMMUNITY_URL}"
          check_url "atlas"          "${ATLAS_URL}"

          # Trim trailing ", " and export for notification steps
          FAILED_SERVICES="${FAILED_SERVICES%, }"
          echo "failed_services=${FAILED_SERVICES}" >> "$GITHUB_OUTPUT"

          if [ "$FAIL" -ne 0 ]; then
            echo ""
            echo "One or more staging HTTPS health checks failed — deployment aborted."
            exit 1
          fi
          echo "==> All five staging HTTPS endpoints returned 200."

      # ── 4. Alert on staging health-check failure ──────────────────────────
      # Mirrors the production alert steps. Configure alert secrets in the
      # `staging` GitHub Actions environment to receive staging failure notices.
      #
      # Slack  — set staging environment secret SLACK_WEBHOOK_URL
      # Email  — set staging environment secrets NOTIFY_EMAIL + SMTP_HOST
      #          + SMTP_PORT + SMTP_USERNAME + SMTP_PASSWORD

      - name: Notify Slack — staging health check failed
        if: steps.healthcheck.outcome == 'failure'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          FAILED_SERVICES:   ${{ steps.healthcheck.outputs.failed_services }}
          COMMIT_SHA:        ${{ github.sha }}
          RUN_URL:           ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not configured — skipping Slack notification"
            exit 0
          fi
          SHORT_SHA="${COMMIT_SHA::8}"
          PAYLOAD=$(printf '{
            "text": ":rotating_light: *Staging health check FAILED*",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": ":rotating_light: *Staging health check FAILED*\n*Commit:* `%s`\n*Failed services:* %s\n<%s|View workflow run \u2192>"
                }
              }
            ]
          }' "$SHORT_SHA" "${FAILED_SERVICES:-unknown}" "$RUN_URL")
          curl -sf -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD"
          echo "Slack notification sent."

      - name: Notify email — staging health check failed
        if: steps.healthcheck.outcome == 'failure'
        env:
          NOTIFY_EMAIL:    ${{ secrets.NOTIFY_EMAIL }}
          SMTP_HOST:       ${{ secrets.SMTP_HOST }}
          SMTP_PORT:       ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME:   ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD:   ${{ secrets.SMTP_PASSWORD }}
          FAILED_SERVICES: ${{ steps.healthcheck.outputs.failed_services }}
          COMMIT_SHA:      ${{ github.sha }}
          RUN_URL:         ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$NOTIFY_EMAIL" ] || [ -z "$SMTP_HOST" ] || [ -z "$SMTP_USERNAME" ] || [ -z "$SMTP_PASSWORD" ]; then
            echo "Email secrets not fully configured (NOTIFY_EMAIL, SMTP_HOST, SMTP_USERNAME, SMTP_PASSWORD required) — skipping email notification"
            exit 0
          fi
          SHORT_SHA="${COMMIT_SHA::8}"
          PORT="${SMTP_PORT:-587}"
          SUBJECT="[Sovereign Office Staging] Health check FAILED — ${SHORT_SHA}"
          BODY="One or more staging HTTPS health checks failed after deploying commit ${SHORT_SHA}.\n\nFailed services: ${FAILED_SERVICES:-unknown}\n\nPlease review the workflow run for details:\n${RUN_URL}"
          printf '%b' "$BODY" | curl -sf \
            --url "smtp://${SMTP_HOST}:${PORT}" \
            --ssl-reqd \
            --user "${SMTP_USERNAME}:${SMTP_PASSWORD}" \
            --mail-from "${SMTP_USERNAME}" \
            --mail-rcpt "${NOTIFY_EMAIL}" \
            --upload-file - \
            --header "Subject: ${SUBJECT}" \
            --header "Content-Type: text/plain"
          echo "Email notification sent to ${NOTIFY_EMAIL}."
