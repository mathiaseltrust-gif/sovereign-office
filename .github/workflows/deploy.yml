# ============================================================================
# Sovereign Office — CI/CD Pipeline
#
# Triggers on every push to `main`.
#
# What it does:
#   1. Builds all four Docker images (api, sovereign, trust, community)
#   2. Pushes each image to Azure Container Registry (ACR) with two tags:
#        - <git-sha>  — immutable, pinned to this exact commit
#        - latest     — floating tag always pointing at the newest build
#   3. SSHs into the Azure VM and performs a rolling restart:
#        runs DB schema migrations, pulls new images, restarts each service.
#
# Required GitHub repository secrets (Settings → Secrets and variables → Actions):
#
#   ACR_REGISTRY      Azure Container Registry login server
#                     e.g. sovereignoffice.azurecr.io
#   ACR_USERNAME      ACR admin username
#   ACR_PASSWORD      ACR admin password
#   DEPLOY_HOST       Public IP of the Azure VM  e.g. 20.83.210.26
#   DEPLOY_USER       SSH login user on the VM   e.g. azureuser
#   DEPLOY_SSH_KEY    Full PEM-encoded private key matching an authorised_key on the VM
#   DEPLOY_PATH       Absolute path on the VM    e.g. /opt/sovereign-office
# ============================================================================

name: Build & Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ${{ secrets.ACR_REGISTRY }}

jobs:
  # ── 1. Build and push all images ──────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker images
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.sha_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "sha_tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # ── API Server ─────────────────────────────────────────────────────────
      - name: Build and push — api
        uses: docker/build-push-action@v5
        with:
          context: .
          file: artifacts/api-server/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/sovereign-api:${{ steps.meta.outputs.sha_tag }}
            ${{ env.REGISTRY }}/sovereign-api:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/sovereign-api:latest
          cache-to: type=inline

      # ── Sovereign Office Dashboard ─────────────────────────────────────────
      - name: Build and push — sovereign-dashboard
        uses: docker/build-push-action@v5
        with:
          context: .
          file: artifacts/sovereign-dashboard/Dockerfile
          push: true
          build-args: |
            BASE_PATH=/
            VITE_API_URL=${{ vars.VITE_API_URL || 'http://20.83.210.26:8080' }}
          tags: |
            ${{ env.REGISTRY }}/sovereign-dashboard:${{ steps.meta.outputs.sha_tag }}
            ${{ env.REGISTRY }}/sovereign-dashboard:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/sovereign-dashboard:latest
          cache-to: type=inline

      # ── Trust Instruments Dashboard ────────────────────────────────────────
      - name: Build and push — trust-dashboard
        uses: docker/build-push-action@v5
        with:
          context: .
          file: artifacts/trust-dashboard/Dockerfile
          push: true
          build-args: |
            BASE_PATH=/
            VITE_API_URL=${{ vars.VITE_API_URL || 'http://20.83.210.26:8080' }}
          tags: |
            ${{ env.REGISTRY }}/trust-dashboard:${{ steps.meta.outputs.sha_tag }}
            ${{ env.REGISTRY }}/trust-dashboard:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/trust-dashboard:latest
          cache-to: type=inline

      # ── Family & Community Dashboard ───────────────────────────────────────
      - name: Build and push — community-dashboard
        uses: docker/build-push-action@v5
        with:
          context: .
          file: artifacts/community-dashboard/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || 'http://20.83.210.26:8080' }}
          tags: |
            ${{ env.REGISTRY }}/community-dashboard:${{ steps.meta.outputs.sha_tag }}
            ${{ env.REGISTRY }}/community-dashboard:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/community-dashboard:latest
          cache-to: type=inline

      # ── Urban Indian Continuity Atlas ───────────────────────────────────────
      - name: Build and push — urban-indian-atlas
        uses: docker/build-push-action@v5
        with:
          context: .
          file: artifacts/urban-indian-atlas/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || 'http://20.83.210.26:8080' }}
          tags: |
            ${{ env.REGISTRY }}/urban-indian-atlas:${{ steps.meta.outputs.sha_tag }}
            ${{ env.REGISTRY }}/urban-indian-atlas:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/urban-indian-atlas:latest
          cache-to: type=inline

  # ── 2. Deploy to Azure VM via SSH ─────────────────────────────────────────
  deploy:
    name: Rolling restart on Azure VM
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"

            echo "==> Logging in to ACR"
            echo "${{ secrets.ACR_PASSWORD }}" | \
              docker login "${{ secrets.ACR_REGISTRY }}" \
                --username "${{ secrets.ACR_USERNAME }}" \
                --password-stdin

            echo "==> Pinning IMAGE_TAG to ${{ needs.build-and-push.outputs.image_tag }}"
            export IMAGE_TAG="${{ needs.build-and-push.outputs.image_tag }}"

            echo "==> Pulling new images (all five services)"
            docker compose -f docker-compose.prod.yml pull api sovereign trust community atlas

            echo "==> Rolling restart — api"
            docker compose -f docker-compose.prod.yml up -d --no-deps --no-build api
            echo "    Waiting for api to become healthy..."
            timeout 90 bash -c \
              'until docker compose -f docker-compose.prod.yml ps api | grep -q "healthy"; do sleep 3; done'

            echo "==> Rolling restart — sovereign dashboard"
            docker compose -f docker-compose.prod.yml up -d --no-deps --no-build sovereign

            echo "==> Rolling restart — trust dashboard"
            docker compose -f docker-compose.prod.yml up -d --no-deps --no-build trust

            echo "==> Rolling restart — community dashboard"
            docker compose -f docker-compose.prod.yml up -d --no-deps --no-build community

            echo "==> Rolling restart — urban indian atlas"
            docker compose -f docker-compose.prod.yml up -d --no-deps --no-build atlas

            echo "==> Pruning unused images (keeps disk clean)"
            docker image prune -f

            echo "==> Smoke-testing all five services..."
            SMOKE_FAIL=0
            # API health check
            if curl -sf --max-time 10 http://localhost:8080/api/healthz > /dev/null; then
              echo "  ✓ api (8080)"
            else
              echo "  ✗ api (8080) — health check FAILED"
              SMOKE_FAIL=1
            fi
            # Dashboard HTTP checks (nginx returns 200 for SPA index)
            for PORT_NAME in "3001:sovereign" "3002:trust" "3003:community" "3004:atlas"; do
              PORT="${PORT_NAME%%:*}"
              NAME="${PORT_NAME##*:}"
              CODE=$(curl -sf --max-time 10 -o /dev/null -w "%{http_code}" http://localhost:$PORT/ || echo "000")
              if [ "$CODE" = "200" ]; then
                echo "  ✓ $NAME ($PORT)"
              else
                echo "  ✗ $NAME ($PORT) — HTTP $CODE"
                SMOKE_FAIL=1
              fi
            done
            [ "$SMOKE_FAIL" -eq 0 ] || { echo "One or more services failed smoke test"; exit 1; }

            echo "==> Deploy complete. Running containers:"
            docker compose -f docker-compose.prod.yml ps
