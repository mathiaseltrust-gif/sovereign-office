name: Test Azure Secret
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          command_timeout: 3m
          script: |
            set -euo pipefail
            source /opt/sovereign-office/.env

            echo "=== Vars in running container ==="
            docker exec sovereign-office-api-1 sh -c '
              echo "TENANT_ID  first8=${AZURE_ENTRA_TENANT_ID:0:8}"
              echo "CLIENT_ID  first8=${AZURE_ENTRA_CLIENT_ID:0:8}"
              echo "SECRET     len=${#AZURE_ENTRA_CLIENT_SECRET}  first4=${AZURE_ENTRA_CLIENT_SECRET:0:4}  last4=${AZURE_ENTRA_CLIENT_SECRET: -4}"
            '

            echo ""
            echo "=== Test secret via client_credentials against Azure token endpoint ==="
            RESULT=$(curl -s -m 15 -X POST \
              "https://login.microsoftonline.com/${AZURE_ENTRA_TENANT_ID}/oauth2/v2.0/token" \
              --data-urlencode "grant_type=client_credentials" \
              --data-urlencode "client_id=${AZURE_ENTRA_CLIENT_ID}" \
              --data-urlencode "client_secret=${AZURE_ENTRA_CLIENT_SECRET}" \
              --data-urlencode "scope=https://graph.microsoft.com/.default")

            echo "$RESULT" | python3 -c "
import sys, json
try:
    d = json.load(sys.stdin)
    if 'access_token' in d:
        print('SECRET VALID — Azure issued an access token')
    elif 'error' in d:
        print('AZURE ERROR:', d.get('error'))
        desc = d.get('error_description', '')
        print('DESCRIPTION:', desc[:300])
    else:
        print('UNEXPECTED:', str(d)[:200])
except Exception as e:
    print('PARSE ERROR:', e)
"
