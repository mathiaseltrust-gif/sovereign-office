name: Fix Microsoft Auth URI & Redeploy

on:
  workflow_dispatch:

jobs:
  fix-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Base64-encode secrets for safe SSH transfer
        id: b64
        run: |
          echo "tenant=$(printf '%s' '${{ secrets.AZURE_ENTRA_TENANT_ID }}'     | base64 -w0)" >> "$GITHUB_OUTPUT"
          echo "cid=$(printf '%s'    '${{ secrets.AZURE_ENTRA_CLIENT_ID }}'     | base64 -w0)" >> "$GITHUB_OUTPUT"
          echo "csec=$(printf '%s'   '${{ secrets.AZURE_ENTRA_CLIENT_SECRET }}' | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Sync secrets, fix auth URI, force latest image, restart API
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          script: |
            set -euo pipefail
            ENV_FILE=/opt/sovereign-office/.env
            COMPOSE=/opt/sovereign-office/docker-compose.prod.yml
            cd /opt/sovereign-office

            echo "=== 1. Sync AZURE_ENTRA secrets from GitHub secret store → .env ==="
            TENANT=$(printf '%s' '${{ steps.b64.outputs.tenant }}' | base64 -d)
            CID=$(printf '%s'    '${{ steps.b64.outputs.cid }}'    | base64 -d)
            CSEC=$(printf '%s'   '${{ steps.b64.outputs.csec }}'   | base64 -d)
            sed -i '/^AZURE_ENTRA_TENANT_ID=/d'     "$ENV_FILE"
            sed -i '/^AZURE_ENTRA_CLIENT_ID=/d'     "$ENV_FILE"
            sed -i '/^AZURE_ENTRA_CLIENT_SECRET=/d' "$ENV_FILE"
            printf 'AZURE_ENTRA_TENANT_ID=%s\n'     "$TENANT" >> "$ENV_FILE"
            printf 'AZURE_ENTRA_CLIENT_ID=%s\n'     "$CID"    >> "$ENV_FILE"
            printf 'AZURE_ENTRA_CLIENT_SECRET=%s\n' "$CSEC"   >> "$ENV_FILE"
            echo "  tenant_id  len=${#TENANT}  first4=${TENANT:0:4}"
            echo "  client_id  len=${#CID}     first4=${CID:0:4}"
            echo "  client_sec len=${#CSEC}    first4=${CSEC:0:4}  last4=${CSEC: -4}"

            echo "=== 2. Set MICROSOFT_REDIRECT_URI in .env ==="
            sed -i '/^MICROSOFT_REDIRECT_URI=/d' "$ENV_FILE"
            echo 'MICROSOFT_REDIRECT_URI=https://20.83.210.26:3001/microsoft/callback' >> "$ENV_FILE"

            echo "=== 3. Force IMAGE_TAG=latest in .env ==="
            sed -i '/^IMAGE_TAG=/d' "$ENV_FILE"
            echo 'IMAGE_TAG=latest' >> "$ENV_FILE"

            echo "=== 4. Patch compose for MICROSOFT_REDIRECT_URI if needed ==="
            if ! grep -q 'MICROSOFT_REDIRECT_URI' "$COMPOSE"; then
              sed -i '/SOVEREIGN_DASHBOARD_URL:/a\      MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI:-https://20.83.210.26:3001/microsoft/callback}' "$COMPOSE"
              echo "Patched."
            else
              echo "Already patched."
            fi

            echo "=== 5. Login to ACR and pull latest API image ==="
            source "$ENV_FILE"
            echo "${{ secrets.ACR_PASSWORD }}" | \
              docker login "$ACR_REGISTRY" --username "${{ secrets.ACR_USERNAME }}" --password-stdin
            docker pull "${ACR_REGISTRY}/sovereign-api:latest"

            echo "=== 6. Restart API container ==="
            docker compose -f docker-compose.prod.yml rm -sf api
            IMAGE_TAG=latest docker compose -f docker-compose.prod.yml up -d api

            echo "=== 7. Waiting 50s for API to initialise ==="
            sleep 50

            echo "=== Container status ==="
            docker ps --filter "name=api" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

            echo "=== API health ==="
            curl -sf --max-time 10 http://localhost:8080/api/healthz && echo " HEALTHY" || echo " NOT YET HEALTHY"

            echo "=== Microsoft auth config ==="
            curl -sf --max-time 10 http://localhost:8080/api/auth/microsoft/config || echo "FAILED"

            echo "=== API recent logs ==="
            docker logs sovereign-office-api-1 --tail 10 2>&1
