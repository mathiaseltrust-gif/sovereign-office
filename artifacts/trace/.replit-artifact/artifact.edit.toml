kind = "web"
previewPath = "/trace/"
title = "TRACE — Tribal Rights & Administrative Compliance Engine"
version = "1.0.0"
id = "artifacts/trace"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/trace/" ]
localPort = 20820

[services.development]
run = "pnpm --filter @workspace/trace run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/trace", "run", "build" ]
publicDir = "artifacts/trace/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20820"
BASE_PATH = "/trace/"
